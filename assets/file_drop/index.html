<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Composer file drop</title>
<style>body{margin:0;background:transparent}</style></head><body><script>
(() => {
 const send=(type,details={})=>window.parent.postMessage({isStreamlitMessage:true,type,...details},'*');
 const doc=window.parent.document;
 let chatId='',disabled=true,remaining=0,maxBytes=10*1024*1024,busy=false,disposed=false,sendButton=null,wasDisabled=false;
 const composer=()=>doc.querySelector('.st-key-chat_composer');
 const fileDrag=e=>Array.from(e.dataTransfer?.types||[]).includes('Files');
 const inside=e=>!!e.target?.closest?.('.st-key-chat_composer');
 const highlight=on=>composer()?.classList.toggle('file-drag-over',on);
 const publish=(type,details)=>{
  if(!disposed)send('streamlit:setComponentValue',{dataType:'json',value:{type,chat_id:chatId,id:Date.now()+'-'+Math.random().toString(36).slice(2),...details}});
 };
 function lock(on){
  busy=on;composer()?.classList.toggle('file-drop-busy',on);
  if(on){sendButton=doc.querySelector('.st-key-chat_composer [data-testid="stFormSubmitButton"] button');wasDisabled=sendButton?.disabled||false;}
  if(sendButton)sendButton.disabled=on||wasDisabled;
 }
 function over(e){
  if(!fileDrag(e))return;
  e.preventDefault();
  if(inside(e)&&!disabled&&!busy){e.dataTransfer.dropEffect='copy';highlight(true);}
  else{e.dataTransfer.dropEffect='none';highlight(false);}
 }
 function leave(e){if(!e.relatedTarget||!e.relatedTarget.closest?.('.st-key-chat_composer'))highlight(false);}
 function end(){highlight(false);}
 function read(file){return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve({name:file.name,content:String(reader.result).split(',',2)[1]});
  reader.onerror=()=>reject(new Error('This file could not be read. Please try the + button.'));
  reader.readAsDataURL(file);
 });}
 async function drop(e){
  if(!fileDrag(e))return;
  e.preventDefault();highlight(false);
  if(!inside(e)||disabled||busy)return;
  e.stopPropagation();
  const files=Array.from(e.dataTransfer.files||[]);
  try{
   if(!files.length)throw new Error('Drop a PDF, TXT or report photo to attach it.');
   if(files.length>remaining)throw new Error('Send up to 3 files at a time. Remove a file before adding another.');
   for(const file of files){
    if(!/\.(pdf|txt|png|jpe?g)$/i.test(file.name))throw new Error('Supported files: PDF, TXT, PNG and JPEG.');
    if(!file.size||file.size>maxBytes)throw new Error('Each file must be nonempty and no larger than 10 MB.');
   }
   lock(true);
   publish('files',{files:await Promise.all(files.map(read))});
  }catch(error){publish('error',{message:error.message});}
  finally{lock(false);}
 }
 function guard(e){if(busy&&e.key==='Enter'&&inside(e)){e.preventDefault();e.stopPropagation();}}
 doc.addEventListener('dragover',over,true);doc.addEventListener('dragleave',leave,true);
 doc.addEventListener('drop',drop,true);doc.addEventListener('dragend',end,true);
 doc.addEventListener('keydown',guard,true);
 window.addEventListener('message',e=>{
  if(e.source!==window.parent||e.data?.type!=='streamlit:render')return;
  chatId=e.data.args.chat_id;disabled=!!e.data.args.disabled;remaining=e.data.args.remaining;maxBytes=e.data.args.max_bytes;
  if(disabled)highlight(false);
 });
 window.addEventListener('beforeunload',()=>{
  disposed=true;highlight(false);lock(false);
  doc.removeEventListener('dragover',over,true);doc.removeEventListener('dragleave',leave,true);
  doc.removeEventListener('drop',drop,true);doc.removeEventListener('keydown',guard,true);
  doc.removeEventListener('dragend',end,true);
 });
 send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:0});
})();
</script></body></html>
